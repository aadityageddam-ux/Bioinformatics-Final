[project]
name = "sox17-tail"
version = "0.1.0"
description = "Does the SOX17FNV disordered C-terminal tail act by length or by sequence?"
requires-python = ">=3.11"
dependencies = [
    "biopython==1.85",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.2",
    "openpyxl==3.1.5",
    "matplotlib==3.10.1",
    "pyyaml==6.0.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sox17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
